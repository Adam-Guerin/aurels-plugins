[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurels-hermes"
version = "0.2.1"
description = "Independent Aurels preflight guard for Hermes actions."
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

[project.entry-points."hermes_agent.plugins"]
aurels-hermes = "aurels_hermes:register"

[tool.setuptools]
packages = ["aurels_hermes"]
