[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurels-crewai"
version = "0.1.0"
description = "Aurels pre-tool security guard for CrewAI tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pydantic",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aurel_crewai*"]
