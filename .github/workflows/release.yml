name: Signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm test
      - name: Build Python package
        working-directory: plugins/aurels-hermes
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Build Node.js package
        working-directory: plugins/aurels-openclaw
        run: npm pack
      - name: Generate release metadata for built archives
        run: |
          npm run release:manifest
          sha256sum plugins/aurels-hermes/dist/* plugins/aurels-openclaw/*.tgz >> dist/SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes --output-signature dist/SHA256SUMS.sig --output-certificate dist/SHA256SUMS.pem dist/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            plugins/aurels-hermes/dist/*
            plugins/aurels-openclaw/*.tgz
      - name: Publish to npm (if token available)
        working-directory: plugins/aurels-openclaw
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: env.NPM_TOKEN != ''
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --access public
      - name: Publish to PyPI (if token available)
        working-directory: plugins/aurels-hermes
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        if: env.PYPI_TOKEN != ''
        run: |
          python -m pip install --upgrade twine
          twine upload dist/* --username __token__ --password "$PYPI_TOKEN"
