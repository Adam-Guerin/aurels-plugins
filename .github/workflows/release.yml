name: Signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install experimental adapter contract-test dependencies
        run: npm ci --prefix plugins/aurels-integrations
      - name: Audit locked npm dependencies
        run: npm audit --audit-level=high --prefix plugins/aurels-integrations
      - name: Install OpenClaw runtime for hook-runner E2E
        run: npm install --prefix .ci/openclaw --no-save --ignore-scripts openclaw@2026.3.28
      - name: Check out Hermes host runtime for native-dispatch E2E
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: f97608f178d1ffeca59860195ab7da295f7c8e5f
          path: .ci/hermes-agent
      - name: Install Hermes core runtime dependencies for dispatcher E2E
        working-directory: .ci/hermes-agent
        run: python -m pip install -e .
      - name: Install isolated CrewAI host runtime
        run: |
          python -m venv .ci/crewai-host
          .ci/crewai-host/bin/python -m pip install crewai==1.15.23
      - name: Run complete plugin and artifact test suite
        env:
          OPENCLAW_PACKAGE_ROOT: ${{ github.workspace }}/.ci/openclaw/node_modules/openclaw
          HERMES_SOURCE_DIR: ${{ github.workspace }}/.ci/hermes-agent
          PYTHONPATH: ${{ github.workspace }}/.ci/hermes-agent
          CREWAI_PYTHON: ${{ github.workspace }}/.ci/crewai-host/bin/python
        run: npm test
      - name: Build Python package
        working-directory: plugins/aurels-hermes
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Build Node.js package
        working-directory: plugins/aurels-openclaw
        run: npm pack
      - name: Generate release metadata for built archives
        run: |
          npm run package:ollama
          npm run package:integrations
          npm run package:claude-code
          npm run package:codex
          npm run package:langgraph
          npm run package:openai-agents
          npm run package:mcp
          npm run release:manifest
          sha256sum plugins/aurels-hermes/dist/* plugins/aurels-openclaw/*.tgz >> dist/SHA256SUMS
          sort -k2 -o dist/SHA256SUMS dist/SHA256SUMS
          test -z "$(cut -d' ' -f3- dist/SHA256SUMS | sort | uniq -d)"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: cosign sign-blob --yes --output-signature dist/SHA256SUMS.sig --output-certificate dist/SHA256SUMS.pem dist/SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/aurels-ollama-plugin.zip
            dist/aurels-framework-integrations.tar.gz
            dist/aurels_crewai-0.1.0-py3-none-any.whl
            dist/aurels-claude-code-plugin.zip
            dist/aurels-codex-guard-plugin.zip
            dist/aurels-langgraph-guard-0.1.0.tgz
            dist/aurels-openai-agents-guard-0.1.0.tgz
            dist/aurels-mcp-proxy-0.1.0.tgz
            plugins/aurels-hermes/dist/*.whl
            plugins/aurels-openclaw/*.tgz
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/MANIFEST.json
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
            dist/PROVENANCE.json
            dist/SBOM.spdx.json
            dist/aurels-ollama-plugin.zip
            dist/aurels-framework-integrations.tar.gz
            dist/aurels_crewai-0.1.0-py3-none-any.whl
            dist/aurels-claude-code-plugin.zip
            dist/aurels-codex-guard-plugin.zip
            dist/aurels-langgraph-guard-0.1.0.tgz
            dist/aurels-openai-agents-guard-0.1.0.tgz
            dist/aurels-mcp-proxy-0.1.0.tgz
            plugins/aurels-hermes/dist/*.whl
            plugins/aurels-hermes/dist/*.tar.gz
            plugins/aurels-openclaw/*.tgz
      - name: Publish to npm (if token available)
        working-directory: plugins/aurels-openclaw
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: env.NPM_TOKEN != ''
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --access public
      - name: Publish to PyPI (if token available)
        working-directory: plugins/aurels-hermes
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        if: env.PYPI_TOKEN != ''
        run: |
          python -m pip install --upgrade twine
          twine upload dist/* --username __token__ --password "$PYPI_TOKEN"
