name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

jobs:
  codex-native-session:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pinned Codex host without account credentials
        run: npm install --prefix .ci/codex --no-save --ignore-scripts @openai/codex@0.160.0
      - name: Build and extract the native hook archive
        run: |
          npm run package:codex
          node -e "require('fs').mkdirSync('.ci/codex-plugin',{recursive:true});require('child_process').execFileSync('tar',['-xf','dist/aurels-codex-guard-plugin.zip','-C','.ci/codex-plugin'])"
      - name: Verify allow, deny, review and outage through real Codex dispatch
        env:
          AURELS_CODEX_CLI: ${{ github.workspace }}/.ci/codex/node_modules/@openai/codex/bin/codex.js
          AURELS_CODEX_HOOK_BIN: ${{ github.workspace }}/.ci/codex-plugin/hooks/aurel-codex-hook.mjs
        run: npm run test:e2e:codex-session

  hermes-windows-telemetry:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Test Hermes enforcement and process-safe telemetry on Windows
        working-directory: plugins/aurels-hermes
        run: python -m unittest discover -s tests
      - name: Verify self-hosted evaluator protocols and CLI on Windows
        run: npm run test:evaluator
      - name: Verify Node and Python queue caps across independent Windows processes
        run: npm run test:e2e:telemetry

  crewai-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install CrewAI and the packaged guard in an isolated environment
        run: |
          python -m venv .ci/crewai-host
          .ci/crewai-host/bin/python -m pip install crewai==1.15.23
          python -m pip wheel --no-deps -w .ci/wheels plugins/aurels-integrations/integrations/crewai
          .ci/crewai-host/bin/python -m pip install --no-deps .ci/wheels/*.whl
      - name: Verify real synchronous and asynchronous CrewAI dispatch
        env:
          AURELS_CREWAI_USE_INSTALLED: '1'
          OTEL_SDK_DISABLED: 'true'
          CREWAI_TELEMETRY_DISABLED: 'true'
        run: .ci/crewai-host/bin/python tests/e2e-crewai-host.py

  marketplace-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install experimental adapter contract-test dependencies
        run: npm ci --prefix plugins/aurels-integrations
      - name: Audit locked npm dependencies
        run: npm audit --audit-level=high --prefix plugins/aurels-integrations
      - name: Verify self-hosted evaluator protocols and CLI
        run: npm run test:evaluator
      - name: Validate marketplace JSON
        run: |
          python -m json.tool marketplace.json > /dev/null
          python -m json.tool .agents/plugins/marketplace.json > /dev/null
      - name: Validate plugin manifests
        shell: bash
        run: |
          shopt -s nullglob
          for manifest in plugins/*/.codex-plugin/plugin.json; do
            python -m json.tool "$manifest" > /dev/null
          done
      - name: Install OpenClaw runtime for hook-runner E2E
        run: npm install --prefix .ci/openclaw --no-save --ignore-scripts openclaw@2026.3.28
      - name: Test OpenClaw plugin against the supported runtime
        working-directory: plugins/aurels-openclaw
        env:
          OPENCLAW_PACKAGE_ROOT: ${{ github.workspace }}/.ci/openclaw/node_modules/openclaw
        run: |
          npm test
          npm run check
      - name: Run OpenClaw hook-runner E2E against packaged runtime
        working-directory: plugins/aurels-openclaw
        env:
          OPENCLAW_PACKAGE_ROOT: ${{ github.workspace }}/.ci/openclaw/node_modules/openclaw
        run: npm run test:e2e:openclaw-host
      - name: Install an older OpenClaw runtime for fail-closed compatibility coverage
        run: npm install --prefix .ci/openclaw-legacy --no-save --ignore-scripts openclaw@2026.3.2
      - name: Verify unsupported OpenClaw runtime blocks actions it cannot approve
        working-directory: plugins/aurels-openclaw
        env:
          OPENCLAW_PACKAGE_ROOT: ${{ github.workspace }}/.ci/openclaw-legacy/node_modules/openclaw
        run: npm run test:e2e:openclaw-host
      - name: Use the supported Node runtime for current OpenClaw
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Install current OpenClaw runtime for compatibility E2E
        run: npm install --prefix .ci/openclaw-current --no-save --ignore-scripts openclaw@2026.9.6
      - name: Verify hook-runner compatibility with current OpenClaw
        working-directory: plugins/aurels-openclaw
        env:
          OPENCLAW_PACKAGE_ROOT: ${{ github.workspace }}/.ci/openclaw-current/node_modules/openclaw
        run: npm run test:e2e:openclaw-host
      - name: Test Hermes plugin
        working-directory: plugins/aurels-hermes
        run: python -m unittest discover -s tests
      - name: Verify telemetry queue caps across independent processes
        run: npm run test:e2e:telemetry
      - name: Check out Hermes host runtime for native-dispatch E2E
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: f97608f178d1ffeca59860195ab7da295f7c8e5f
          path: .ci/hermes-agent
      - name: Install Hermes core runtime dependencies for dispatcher E2E
        working-directory: .ci/hermes-agent
        run: python -m pip install -e .
      - name: Run native Hermes dispatcher E2E
        env:
          HERMES_SOURCE_DIR: ${{ github.workspace }}/.ci/hermes-agent
          PYTHONPATH: ${{ github.workspace }}/.ci/hermes-agent
        run: npm run test:e2e:hermes-host
      - name: Install the built Hermes wheel in a clean environment
        run: python tests/e2e-hermes-package.py
      - name: Test experimental framework adapters
        run: npm --prefix plugins/aurels-integrations test
      - name: Build Ollama download archive
        run: npm run package:ollama
      - name: Generate reproducible release metadata
        run: npm run release:manifest
      - name: Validate installable download artifacts
        run: npm run test:e2e:artifacts
